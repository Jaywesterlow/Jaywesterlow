<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
:root{--snow:oklch(0.985 0.004 240);--snow-2:oklch(0.945 0.020 230);--stone:oklch(0.87 0.030 235);--stone-2:oklch(0.56 0.035 250);
--ink:oklch(0.24 0.050 255);--ink-2:oklch(0.38 0.045 255);--ink-3:oklch(0.74 0.035 245);--piste:oklch(0.56 0.160 250);--piste-2:oklch(0.48 0.160 250);--ice:oklch(0.82 0.070 225);
--glacier:oklch(0.930 0.035 228);--glacier-2:oklch(0.80 0.06 228);
--fd:"Bricolage Grotesque","Arial Narrow",sans-serif;--fb:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--fm:"Geist Mono","SF Mono",Menlo,monospace;}
*{box-sizing:border-box}
body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none} a:hover{color:var(--piste)}
h1,h2,h3,.display{font-family:var(--fd);font-weight:700;letter-spacing:-0.03em;line-height:0.95;margin:0;text-wrap:balance}
h2{font-size:34px;line-height:1.02} h3{font-size:22px;line-height:1.1;letter-spacing:-0.02em;font-weight:600}
p{margin:0}
.label{font-family:var(--fm);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--stone-2);font-weight:500}
.mono{font-family:var(--fm);font-size:13px;letter-spacing:0.01em}
.muted{color:var(--stone-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:4px;font-weight:600;font-size:16px;line-height:1;white-space:nowrap;border:1.5px solid transparent}
.btn.primary{background:var(--piste);color:#fff} .btn.secondary{background:transparent;color:var(--ink);border-color:var(--ink)} .btn.ghost{background:transparent;color:var(--ink);padding:0;height:auto;border:0;border-bottom:1.5px solid var(--ink);border-radius:0}
.btn.sm{height:44px;padding:0 16px;font-size:15px}
.hair{border-top:1px solid var(--stone)}
.card{background:var(--snow-2);border-radius:12px;overflow:hidden}
.photo{position:relative;background:var(--snow-2);background-image:repeating-linear-gradient(135deg,transparent 0 14px,oklch(0.90 0.030 230) 14px 15px);overflow:hidden}
.photo .cap{position:absolute;left:12px;bottom:10px;font-family:var(--fm);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-2);background:var(--snow);padding:4px 8px;border-radius:3px}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--stone);font-family:var(--fm);font-size:12px;letter-spacing:0.04em;color:var(--ink-2);background:var(--snow)}
.facts{display:grid;gap:0;border-top:1px solid var(--stone);border-bottom:1px solid var(--stone)}
.fact{padding:14px 0;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--stone);padding-right:14px}
.fact:last-child{border-right:0}
.fact b{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:-0.02em;line-height:1}
.input{height:52px;border:1.5px solid var(--stone);border-radius:4px;background:#fff;padding:0 14px;display:flex;align-items:center;color:var(--stone-2);font-size:16px}
.ridge{display:block;width:100%;height:auto}
.dark{background:var(--ink);color:var(--snow)} .dark .label{color:var(--ink-3)} .dark .muted{color:var(--ink-3)} .dark .hair{border-color:oklch(0.36 0.05 255)} .dark a{color:var(--snow)}
.spruce{background:var(--glacier);color:var(--ink)} .spruce .label{color:var(--stone-2)} .spruce .hair{border-color:var(--glacier-2)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:1440px;background:var(--snow);min-height:100%;display:flex;flex-direction:column;">
<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:var(--snow)"><span class="mono" style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--snow);padding:6px 10px;border-radius:999px;font-size:11px;border:1px solid var(--snow)">scroll 100%</span><svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
          <rect width="1440" height="900" fill="oklch(0.985 0.004 240)"/>
          <g transform="translate(0,40)"><path d="M0,520 L160,400 L300,460 L460,300 L600,380 L760,260 L900,360 L1060,300 L1200,380 L1340,330 L1440,380 L1440,900 L0,900 Z" fill="oklch(0.90 0.045 228)"/></g>
          <g transform="translate(0,-60)"><path d="M0,640 L200,560 L380,600 L540,500 L720,580 L880,520 L1040,600 L1220,540 L1440,610 L1440,900 L0,900 Z" fill="oklch(0.82 0.07 225)"/></g>
          <g transform="translate(0,-140)"><path d="M0,760 L300,700 L620,740 L900,690 L1200,730 L1440,700 L1440,900 L0,900 Z" fill="oklch(0.93 0.035 228)"/>
            <g fill="oklch(0.24 0.05 255)" opacity="0.9"><path d="M1180,760 l14,-38 l14,38 z"/><path d="M1214,760 l14,-52 l14,52 z"/><path d="M1250,760 l14,-44 l14,44 z"/><path d="M1290,760 l14,-60 l14,60 z"/><path d="M1320,760 l14,-40 l14,40 z"/></g></g>
          <g transform="translate(48,60) scale(0.44999999999999996)"><path d="M0,240 L0,120 L70,50 L128,110 L186,20 L256,90 L256,240" fill="none" stroke="oklch(0.24 0.05 255)" stroke-width="10" stroke-linejoin="miter"/><rect x="-5" y="235" width="266" height="10" fill="oklch(0.24 0.05 255)"/><rect x="48" y="176" width="34" height="64" fill="oklch(0.56 0.16 250)"/></g>
        </svg><div style="position:absolute;left:400px;top:120px;display:flex;flex-direction:column;gap:24px;max-width:760px"><h1 class="display" style="font-size:88px">Vier huizen onder één dak, aan de piste.</h1><p style="font-size:19px;color:var(--ink-2);max-width:40ch">250 tot 400 meter van de gondel. Nederlandse eigenaren die er zelf elke winter skiën.</p><div style="display:flex;gap:12px"><a href="#" class="btn primary">Bekijk beschikbaarheid</a><a href="#" class="btn secondary">De vier appartementen</a></div></div>
            <ul class="facts" style="position:absolute;left:400px;right:48px;top:560px;grid-template-columns:repeat(4, minmax(0, 1fr));gap:24px;border-color:var(--glacier-2)"><li class="fact" style="border-color:var(--glacier-2)"><span class="label">Tot de lift</span><b>250–400 m</b></li><li class="fact" style="border-color:var(--glacier-2)"><span class="label">Personen</span><b>2–8</b></li><li class="fact" style="border-color:var(--glacier-2)"><span class="label">Prijs</span><b>per week, alles-in</b></li><li class="fact" style="border:0"><span class="label">Antwoord</span><b>binnen 24 u</b></li></ul></div>
</div>
</x-dc>
</body>
</html>
